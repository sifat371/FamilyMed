name: Export Foundation Artifacts

on:
  pull_request:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv lock
        working-directory: backend
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Generate Android/iOS host projects
        run: flutter create --platforms=android,ios --org com.familymed --project-name familymed .generated_scaffold
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: familymed-foundation-generated
          include-hidden-files: true
          path: |
            backend/uv.lock
            mobile/pubspec.lock
            mobile/.generated_scaffold/.metadata
            mobile/.generated_scaffold/android
            mobile/.generated_scaffold/ios
