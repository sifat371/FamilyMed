# Zero-cost FamilyMed demo/beta: Render Free web + external Neon Free PostgreSQL.
# Not suitable for safety-critical medication reminders or actual patient records.
# Render Free spins down after inactivity. Neon Free can also scale to zero.
# No Render database is provisioned by this Blueprint.
services:
  - type: web
    name: familymed-beta-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/ready
    envVars:
      - key: FAMILYMED_ENV
        value: production
      - key: FAMILYMED_DATABASE_URL
        sync: false # Supply Neon Free TLS-required URL in Render's secret input.
      - key: FAMILYMED_JWT_SECRET
        generateValue: true
      - key: FAMILYMED_SUPPORT_EMAIL
        sync: false # Owner-approved public support/privacy inbox.
      - key: FAMILYMED_CORS_ORIGINS
        value: ""
