# FamilyMed V1 production infrastructure (Render Blueprint)
# Import after all stacked PRs are merged to main. Plans below are PAID.
databases:
  - name: familymed-prod-db
    region: singapore
    postgresMajorVersion: "17"
    plan: 0.1c-256mb
    databaseName: familymed
    user: familymed
    ipAllowList: []

services:
  - type: web
    name: familymed-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/ready
    envVars:
      - key: FAMILYMED_ENV
        value: production
      - key: FAMILYMED_DATABASE_URL
        fromDatabase:
          name: familymed-prod-db
          property: connectionString
      - key: FAMILYMED_JWT_SECRET
        generateValue: true
      # Required before public access: confirmed owner-controlled inbox.
      - key: FAMILYMED_SUPPORT_EMAIL
        sync: false
      # Flutter uses native HTTP requests. Browser CORS is not required for V1.
      - key: FAMILYMED_CORS_ORIGINS
        value: ""
